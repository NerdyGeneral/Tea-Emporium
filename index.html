<script>
const panels = {
  warning: {
    title: 'Are you sure',
    paragraphs: ['Tea is the King’s drink of choice. There is a reason one takes afternoon tea. Nobody has ever put on a good hat, laid out the silver, and invited the neighbours round for afternoon beans.', 'Still, you have come all this way, and Cook has already found the little grinder. Shall we tell her to carry on?'],
    buttons: [['I insist on coffee', 'coffee'], ['Back to tea', 'close']]
  },
  coffee: {
    title: 'The coffee menu',
    paragraphs: ['Cook has the grinder ready. The coffee shelf is empty for now.'],
    buttons: [['Back to the emporium', 'close']]
  },
  tea: {
    title: 'The tea shelf',
    paragraphs: ['Our tins are empty for the moment. While the kettle warms, may we offer a little reading?'],
    buttons: [['Read the brewing guides', 'guides'], ['Back to the emporium', 'close']]
  },
  cart: {title: 'Your cart', paragraphs: ['Your cart is empty.'], buttons: [['Back to the emporium', 'close']]},
  black: {title: 'The breakfast pot', paragraphs: ['Warm the pot with a splash of hot water, then empty it. Start with one teaspoon of loose black tea per cup.', 'Pour freshly boiled water over the leaves. Steep for 3–5 minutes, tasting at three, then strain the whole pot. Milk is a matter for your own conscience.']},
  green: {title: 'A gentler cup', paragraphs: ['Start with one teaspoon of green tea per cup and water at about 75–80°C (167–176°F).', 'Steep for 1–2 minutes, then strain. Taste before you set the leaves aside. A good second steep is one of the quiet economies of the tea table.']},
  herbal: {title: 'From the herb garden', paragraphs: ['Rinse a small handful of fresh mint and gently bruise the leaves between your fingers. Place them in a warmed pot.', 'Add a cup of freshly boiled water, cover, and leave for 5–7 minutes. Strain and serve while the steam still smells of the garden.']}
};
const dialog = document.querySelector('dialog');
const title = document.getElementById('panel-title');
const copy = document.getElementById('copy');
const actions = document.querySelector('.actions');
function showPanel(key) {
  const panel = panels[key];
  title.textContent = panel.title;
  copy.replaceChildren(...panel.paragraphs.map(text => {
    const p = document.createElement('p');
    p.textContent = text;
    return p;
  }));
  const choices = panel.buttons || [['Back to the guides', 'close']];
  actions.replaceChildren(...choices.map(([label, destination], index) => {
    const button = document.createElement('button');
    button.textContent = label;
    button.className = index === 0 ? 'btn' : 'text-link';
    button.addEventListener('click', () => {
      if (destination === 'close') dialog.close();
      else if (destination === 'guides') {
        dialog.close();
        document.querySelector('.guide').focus();
        document.querySelector('#guides').scrollIntoView();
      } else showPanel(destination);
    });
    return button;
  }));
  if (!dialog.open) dialog.showModal();
  title.focus();
}
document.querySelectorAll('[data-panel]').forEach(button => button.addEventListener('click', () => showPanel(button.dataset.panel)));
dialog.addEventListener('click', event => {
  const rect = dialog.getBoundingClientRect();
  if (event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) dialog.close();
});
</script>
